title: WinRing0 Driver Downloaded via Command Line
id: 56d828d5-f28b-48b5-aba7-531351f184f7
status: experimental
description: |
  Detects a command line that names the WinRing0 vulnerable driver alongside a URL. Cryptominer
  droppers fetch WinRing0x64.sys next to the miner so it can tune CPU registers, while hardware
  monitoring tools ship the driver inside their installers rather than downloading it on its own.
  Look for a miner binary and config.json downloaded to the same directory and a service created to run it.
author: Matt Anderson (Huntress)
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1496/
date: 2026-10-08
logsource:
  category: process_creation
  product: windows
detection:
  selection_driver:
    CommandLine|contains: 'winring0'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: all of selection_*
falsepositives:
  - Administrators manually fetching a hardware-monitoring driver
level: high
tags:
  - attack.command_and_control
  - attack.t1105
  - attack.impact
  - attack.t1496
